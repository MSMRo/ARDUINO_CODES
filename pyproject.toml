[project]
name = "arduino-codes-made-easy"
version = "0.1.0"
description = "Interactive ATmega2560 Arduino learning platform built with Streamlit, FastAPI, and PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "streamlit>=1.39.0",
    "requests>=2.32.3",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

